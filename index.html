<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedicalApp - Download</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 480px;
        }
        .logo {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2.5rem;
        }
        #qrcode {
            display: inline-block;
            padding: 1rem;
            background: white;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .scan-text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .download-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
        }
        .info {
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.8rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏥</div>
        <h1>Golazo Medical App</h1>
        <p class="subtitle">Scan the QR code to download</p>
        <div id="qrcode"></div>
        <p class="scan-text">Point your phone camera at the QR code</p>
        <a href="https://github.com/alessiarados/MedicalApp-Download/releases/download/v1.0/app-debug.apk" class="download-btn">
            ⬇ Download APK
        </a>
        <p class="info">
            Android only · v1.0 · 18.6 MB<br>
            You may need to enable "Install from unknown sources" in your phone settings.
        </p>
    </div>
    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: "https://github.com/alessiarados/MedicalApp-Download/releases/download/v1.0/app-debug.apk",
            width: 220,
            height: 220,
            colorDark: "#1e293b",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
